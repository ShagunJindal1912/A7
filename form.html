<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="font-size: 4em; color: black; font-style: italic; text-align: center ; text-decoration: underline;">Registration Form</h1>
    <form method="get" autocomplete="on">
        <label>Name : </label>
        <input type="text"; placeholder="Enter your name";>
        <br><br>
        <label>Email : </label>
        <input type="email"; placeholder="Enter your email";>
        <br><br>
        <label>Date : </label>
        <input type="date";>
        <br><br>
        <label>Time : </label>
        <input type="time">
        <br><br>
        <label>Gender : </label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>
        <label>Age : </label>
        <input type="number"; placeholder="Enter your age";>
        <br><br>
        <label>Country : </label>
        <select>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>    
        </select>
        <br><br>    
        <label>Hobbies : </label>
        <input type="checkbox" name="hobby" value="reading">Reading
        <input type="checkbox" name="hobby" value="traveling">Traveling
        <input type="checkbox" name="hobby" value="sports">Sports
        <br><br>
        <!--<label>Color : </label>
        <input type="color">
        <br><br>
        <label>File : </label>
        <input type="file">
        <br><br>-->
        <label>About Yourself : </label>
        <br>
        <textarea rows="5" cols="40" placeholder="Tell us about yourself"></textarea>
        <br><br>
       <action>
        <button type="submit" href="loginwindow.html">Submit</button>
        </action>
        <button type="reset">Reset</button>
        <br><br>
        <a href="loginwindow.html">click to login</a>
    </form>
</body>
</html>
